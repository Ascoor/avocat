services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, api, search-api]
    networks: [app]

  frontend:
    build:
      context: ./avocat-frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_SEARCH_API_URL: "/search-api/search"
    restart: unless-stopped
    expose: ["8080"]
    networks: [app]

  api:
    build:
      context: ./avocat-backend
    image: avocat-backend:oracle
    restart: unless-stopped
    environment:
      APP_NAME: Avocat
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      FRONTEND_URLS: ${FRONTEND_URLS}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      SESSION_SECURE_COOKIE: "true"
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Avocat}
    volumes:
      - laravel_storage:/var/www/html/storage/app
    expose: ["8000"]
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks: [app, data]

  queue-worker:
    image: avocat-backend:oracle
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    environment:
      APP_NAME: Avocat
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
    volumes:
      - laravel_storage:/var/www/html/storage/app
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      api:
        condition: service_started
    networks: [data]

  search-api:
    build:
      context: ./search-api
    restart: unless-stopped
    environment:
      PORT: "9100"
      FASTAPI_ALLOWED_ORIGINS: ${FASTAPI_ALLOWED_ORIGINS}
    expose: ["9100"]
    networks: [app]

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

volumes:
  postgres_data:
  redis_data:
  laravel_storage:
  caddy_data:
  caddy_config:

networks:
  app:
  data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avocat-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - avocat

  web:
    image: nginx:1.25-alpine
    container_name: avocat-web
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - avocat

  db:
    image: mysql:8.0
    container_name: avocat-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - avocat

  redis:
    image: redis:7-alpine
    container_name: avocat-redis
    profiles:
      - redis
    ports:
      - "6379:6379"
    networks:
      - avocat

networks:
  avocat:
    driver: bridge

volumes:
  db_data:

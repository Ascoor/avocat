server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/avocat/avocat-frontend/dist;
    index index.html;

    client_max_body_size 20M;

    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/avocat/avocat-backend/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/avocat/avocat-backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/avocat/avocat-backend/public;
        internal;
    }

    location /search-api/ {
        proxy_pass http://127.0.0.1:9100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

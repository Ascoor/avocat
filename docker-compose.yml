name: "avocat-project"

services:
  # 1. قاعدة البيانات
  pg:
    image: postgres:16-alpine
    container_name: avc-pg
    restart: unless-stopped
    env_file:
      - ./database.env
    volumes:
      - avc-pg-data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. الخلفية (Laravel/PHP)
  api:
    build:
      context: ./avocat-backend
      dockerfile: Dockerfile
    image: avocat-backend:latest
    container_name: avc-api
    restart: unless-stopped
    entrypoint: ["bash", "/var/www/html/docker-entrypoint.sh"]
    env_file:
      - ./backend.env
    volumes:
      - ./avocat-backend:/var/www/html
      - ./backend.env:/var/www/html/.env.docker:ro
    depends_on:
      pg:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - app-network

  # 3. الواجهة (React/Node)
  web:
    image: node:20-alpine
    container_name: avc-web
    restart: unless-stopped
    working_dir: /usr/src/app
    env_file:
      - ./frontend.env
    volumes:
      - ./avocat-frontend:/usr/src/app
      - avc-web-node-modules:/usr/src/app/node_modules
    ports:
      - "8080:8080"
    entrypoint: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 8080 --open false"]
    depends_on:
      - api
    networks:
      - app-network

volumes:
  avc-pg-data:
    driver: local
  avc-web-node-modules:
    driver: local

networks:
  app-network:
    driver: bridge
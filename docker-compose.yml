services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    volumes:
      - ./avocatapp:/var/www
    depends_on:
      - db

  backend-nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./avocatapp:/var/www
      - ./docker/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  search:
    build:
      context: .
      dockerfile: docker/search/Dockerfile
    volumes:
      - ./search-api:/app
    ports:
      - "8001:8001"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - ./avocat-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_SEARCH_API_URL=http://localhost:8001

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: avocat
      MYSQL_USER: avocat
      MYSQL_PASSWORD: avocat_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro

volumes:
  dbdata:

name: "3.9"  # يمكن إزالته في حال كنت تستخدم Docker Compose v2.x

services:
  pg:
    image: postgres:16-alpine
    container_name: avc-pg
    restart: unless-stopped
    env_file:
      - ./database.env
    volumes:
      - avc-pg-data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 30

  cache:
    image: redis:7-alpine
    container_name: avc-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

  api:
    image: avocat-backend:latest
    build:
      context: ./new-avocatapp
      dockerfile: Dockerfile
    container_name: avc-api
    restart: unless-stopped
    entrypoint: ["bash", "/var/www/html/docker-entrypoint.sh"]
    env_file:
      - ./backend.env
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      COMPOSER_ALLOW_SUPERUSER: "1"
    volumes:
      - ./new-avocatapp:/var/www/html
      - ./backend.env:/var/www/html/.env.docker:ro
      - avc-composer-cache:/tmp/composer-cache
    depends_on:
      pg:
        condition: service_healthy
      cache:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - backend
      - database

  web:
    image: node:20-alpine
    container_name: avc-web
    restart: unless-stopped
    working_dir: /usr/src/app
    env_file:
      - ./frontend.env
    volumes:
      - ./avocat-frontend:/usr/src/app
      - avc-web-node-modules:/usr/src/app/node_modules
    ports:
      - "8080:8080"
    entrypoint: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port=8080"]
    depends_on:
      - api
    networks:
      - frontend
      - backend

volumes:
  avc-pg-data:
    driver: local
  avc-composer-cache:
    driver: local
  avc-web-node-modules:
    driver: local

networks:
  backend:
  frontend:
  database:

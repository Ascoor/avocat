name: "3.9"

services:
  pg:
    image: postgres:16-alpine
    container_name: avc-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    volumes:
      - avc-pg-data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d app" ]
      interval: 10s
      timeout: 5s
      retries: 30

  cache:
    image: redis:7-alpine
    container_name: avc-cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./avocatapp
      dockerfile: Dockerfile
    container_name: avc-api
    restart: unless-stopped
    env_file:
      - ./avocatapp/.env.docker
    volumes:
      - ./avocatapp:/var/www/html
      - avc-api-vendor:/var/www/html/vendor
    depends_on:
      pg:
        condition: service_healthy
      cache:
        condition: service_started
    ports:
      - "8000:8000"

  web:
    image: node:20-alpine
    container_name: avc-web
    working_dir: /usr/src/app
    volumes:
      - ./avocat-frontend:/usr/src/app
      - avc-web-node-modules:/usr/src/app/node_modules
    ports:
      - "8088:8080"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port=8080"

volumes:
  avc-pg-data:
  avc-api-vendor:
  avc-web-node-modules:

name: Deploy to Oracle VM

on:
  push:
    branches:
      - deploy/oracle-cloud
  workflow_dispatch:

concurrency:
  group: oracle-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Bootstrap VM and update repository
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          SSH="ssh -i ~/.ssh/oracle ${ORACLE_USER:-ubuntu}@${ORACLE_HOST}"
          $SSH 'command -v docker >/dev/null 2>&1 || (curl -fsSL https://raw.githubusercontent.com/Ascoor/avocat/deploy/oracle-cloud/deploy/oracle/bootstrap.sh | sudo bash)'
          $SSH 'if [ ! -d /opt/avocat/.git ]; then git clone --branch deploy/oracle-cloud --single-branch https://github.com/Ascoor/avocat.git /opt/avocat; else cd /opt/avocat && git fetch origin deploy/oracle-cloud && git checkout deploy/oracle-cloud && git reset --hard origin/deploy/oracle-cloud; fi'

      - name: Install production environment file
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_ENV_FILE: ${{ secrets.ORACLE_ENV_FILE }}
        run: |
          ENV_B64="$(printf '%s' "$ORACLE_ENV_FILE" | base64 -w 0)"
          ssh -i ~/.ssh/oracle "${ORACLE_USER:-ubuntu}@${ORACLE_HOST}" "printf '%s' '$ENV_B64' | base64 -d > /opt/avocat/.env.oracle && chmod 600 /opt/avocat/.env.oracle"

      - name: Build and deploy application
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/oracle "${ORACLE_USER:-ubuntu}@${ORACLE_HOST}" 'cd /opt/avocat && docker compose --env-file .env.oracle -f docker-compose.oracle.yml up -d --build --remove-orphans && docker compose --env-file .env.oracle -f docker-compose.oracle.yml ps && docker image prune -f'

      - name: Smoke test
        shell: bash
        env:
          APP_URL: ${{ secrets.ORACLE_APP_URL }}
        run: |
          test -n "$APP_URL"
          curl --fail --show-error --silent --retry 8 --retry-delay 5 --max-time 20 "$APP_URL" >/dev/null
